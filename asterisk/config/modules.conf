;
; modules.conf - Lean IVR-only configuration for PJSIP + alaw/ulaw/g722
;
; This configuration ensures only essential modules for IVR operation over PJSIP
; are loaded. It provides a runtime safeguard against unused modules.
;
; IMPORTANT: This file is a template. After first container start with sample configs,
; you can replace /etc/asterisk/modules.conf with this file or merge these directives.
;

[modules]
; Load core modules automatically, but explicitly noload unused ones below
autoload=yes

;
; ============================================================================
; Channel Drivers - Disable all except chan_pjsip (keep chan_bridge_media for IVR)
; ============================================================================
;
noload => chan_sip.so              ; Legacy chan_sip (use PJSIP instead)
noload => chan_iax2.so             ; IAX2 protocol
noload => chan_mgcp.so             ; MGCP protocol
noload => chan_skinny.so           ; Skinny/SCCP protocol
noload => chan_unistim.so          ; Unistim protocol
noload => chan_ooh323.so           ; H.323 protocol
noload => chan_dahdi.so            ; DAHDI hardware interface
noload => chan_mobile.so           ; Bluetooth mobile
noload => chan_console.so          ; Console channel driver
noload => chan_misdn.so            ; mISDN driver
noload => chan_phone.so            ; Quicknet PhoneJack/LineJack
noload => chan_alsa.so             ; ALSA console
noload => chan_oss.so              ; OSS console
noload => chan_motif.so            ; Jingle/Motif (XMPP)
noload => chan_nbs.so              ; Network Broadcast Sound

;
; ============================================================================
; Codecs - Keep ONLY alaw, ulaw, g722 (disable all others)
; ============================================================================
;
; Keep these (autoload=yes will load them):
; - codec_alaw.so
; - codec_ulaw.so
; - codec_g722.so
;
noload => codec_ilbc.so            ; iLBC codec
noload => codec_lpc10.so           ; LPC10 codec
noload => codec_speex.so           ; Speex codec
noload => codec_opus.so            ; Opus codec
noload => codec_silk.so            ; SILK codec
noload => codec_siren7.so          ; Siren7 codec
noload => codec_siren14.so         ; Siren14 codec
noload => codec_g726.so            ; G.726 codec
noload => codec_adpcm.so           ; ADPCM codec
noload => codec_gsm.so             ; GSM codec
noload => codec_resample.so        ; Resample codec (transcoding - not needed for IVR)
noload => codec_dahdi.so           ; DAHDI codec

;
; ============================================================================
; Format Handlers - Keep PCM/WAV for prompts, disable others
; ============================================================================
;
; Keep these for sound file playback:
; - format_pcm.so
; - format_wav.so
; - format_wav_gsm.so (if needed)
;
noload => format_g719.so           ; G.719 format
noload => format_g723.so           ; G.723 format
noload => format_g726.so           ; G.726 format
noload => format_g729.so           ; G.729 format
noload => format_siren7.so         ; Siren7 format
noload => format_siren14.so        ; Siren14 format
noload => format_sln.so            ; Signed Linear format (rarely needed)
noload => format_vox.so            ; VOX format
noload => format_ilbc.so           ; iLBC format
noload => format_h263.so           ; H.263 video
noload => format_h264.so           ; H.264 video
noload => format_ogg_vorbis.so     ; Ogg Vorbis

;
; ============================================================================
; Applications - Keep IVR essentials, disable voicemail/conferencing/queues/etc.
; ============================================================================
;
; IVR essentials to KEEP (autoload):
; - app_playback.so      (Playback)
; - app_background.so    (Background)
; - app_read.so          (Read - for DTMF input)
; - app_waitexten.so     (WaitExten)
; - app_stack.so         (Gosub/Return/StackPop)
; - app_verbose.so       (Verbose/NoOp)
; - app_echo.so          (Echo - useful for testing)
; - app_dial.so          (Dial - if needed for transfers)
; - app_hangup.so        (Hangup)
; - app_answer.so        (Answer)
; - app_macro.so         (Macro - if used in dialplan)
;
noload => app_voicemail.so         ; Voicemail
noload => app_voicemailmain.so     ; VoicemailMain
noload => app_directory.so         ; Directory
noload => app_minivm.so            ; MiniVM
noload => app_confbridge.so        ; ConfBridge conferencing
noload => app_meetme.so            ; MeetMe conferencing
noload => app_queue.so             ; Call queues
noload => app_agent_pool.so        ; Agent pool
noload => app_chanspy.so           ; Channel spying
noload => app_parkandannounce.so   ; Call parking with announce
noload => app_parkedcall.so        ; Parked call retrieval
noload => app_fax.so               ; Fax application
noload => app_celgenuserevent.so   ; CEL user events
noload => app_mysql.so             ; MySQL application
noload => app_morsecode.so         ; Morse code
noload => app_getcpeid.so          ; GetCPEID
noload => app_setcallerid.so       ; SetCallerID (use dialplan func instead)
noload => app_adsiprog.so          ; ADSI programming
noload => app_alarmreceiver.so     ; Alarm receiver
noload => app_amd.so               ; Answering Machine Detection
noload => app_festival.so          ; Festival TTS
noload => app_dictate.so           ; Dictation
noload => app_dumpchan.so          ; DumpChan
noload => app_externalivr.so       ; External IVR (not needed for basic IVR)
noload => app_followme.so          ; FollowMe
noload => app_forkcdr.so           ; ForkCDR
noload => app_ices.so              ; ICES streaming
noload => app_image.so             ; Image transmission
noload => app_monitor.so           ; Monitor/recording
noload => app_nbscat.so            ; NBS playback
noload => app_page.so              ; Page application
noload => app_record.so            ; Record application
noload => app_sms.so               ; SMS application
noload => app_speech_utils.so      ; Speech recognition
noload => app_test.so              ; Test framework apps
noload => app_url.so               ; SendURL
noload => app_zapateller.so        ; Zapateller
noload => app_dahdiras.so          ; DAHDI RAS
noload => app_flash.so             ; Flash
noload => app_senddtmf.so          ; SendDTMF (use dialplan func)
noload => app_sendtext.so          ; SendText
noload => app_softhangup.so        ; SoftHangup
noload => app_system.so            ; System (security risk)
noload => app_originate.so         ; Originate

;
; ============================================================================
; Resources - Keep PJSIP stack, RTP, logging, disable ARI/AMI/HTTP/SNMP/Calendar/etc.
; ============================================================================
;
; Essential PJSIP/RTP to KEEP (autoload):
; - res_pjsip.so
; - res_pjsip_session.so
; - res_pjsip_outbound_registration.so (if registering to FritzBox)
; - res_pjsip_endpoint_identifier_ip.so
; - res_pjsip_endpoint_identifier_user.so
; - res_pjsip_authenticator_digest.so
; - res_pjsip_nat.so
; - res_pjsip_transport_websocket.so (only if using WebRTC, else noload)
; - res_pjsip_sdp_rtp.so
; - res_pjsip_acl.so
; - res_pjsip_dialog_info_body_generator.so
; - res_pjsip_dtmf_info.so
; - res_pjsip_refer.so
; - res_pjproject.so
; - res_rtp_asterisk.so
; - res_sorcery_config.so
; - res_sorcery_memory.so
; - res_sorcery_astdb.so
; - res_logger.so
; - res_timing_timerfd.so (or res_timing_pthread)
;
; Optional (enable if SRTP/TLS needed for FritzBox):
; - res_srtp.so    (Secure RTP - noload if not using SRTP)
; - res_crypto.so  (Crypto keys - noload if not using SRTP)
;
; Disable ARI/Stasis:
noload => res_ari.so
noload => res_ari_applications.so
noload => res_ari_asterisk.so
noload => res_ari_bridges.so
noload => res_ari_channels.so
noload => res_ari_device_states.so
noload => res_ari_endpoints.so
noload => res_ari_events.so
noload => res_ari_mailboxes.so
noload => res_ari_model.so
noload => res_ari_playbacks.so
noload => res_ari_recordings.so
noload => res_ari_sounds.so
noload => res_http_websocket.so    ; WebSocket (unless needed for WebRTC)
noload => res_stasis.so
noload => res_stasis_answer.so
noload => res_stasis_playback.so
noload => res_stasis_recording.so
noload => res_stasis_snoop.so
noload => res_stasis_test.so
noload => res_stasis_device_state.so
noload => res_stasis_mailbox.so

; Disable AMI/Manager if not needed (keep if you use AMI for monitoring):
; noload => manager.so             ; Uncomment to disable AMI
; noload => res_manager_devicestate.so
; noload => res_manager_presencestate.so

; Disable HTTP server if not using ARI/AMI over HTTP:
noload => res_http_post.so
; noload => res_http.so            ; Uncomment if not using web interfaces

; Disable monitoring/analytics:
noload => res_hep.so               ; HEP/Homer
noload => res_hep_pjsip.so
noload => res_hep_rtcp.so
noload => res_snmp.so              ; SNMP

; Disable clustering/messaging:
noload => res_corosync.so          ; Corosync
noload => res_xmpp.so              ; XMPP

; Disable music on hold if not used:
noload => res_musiconhold.so       ; Music on Hold

; Disable parking:
noload => res_parking.so

; Disable fax:
noload => res_fax.so
noload => res_fax_spandsp.so

; Disable calendar:
noload => res_calendar.so
noload => res_calendar_caldav.so
noload => res_calendar_ews.so
noload => res_calendar_exchange.so
noload => res_calendar_icalendar.so

; Disable database/ODBC:
noload => res_config_odbc.so
noload => res_config_pgsql.so
noload => res_config_ldap.so
noload => res_config_sqlite3.so
noload => res_odbc.so
noload => res_odbc_transaction.so

; Disable CDR/CEL if not needed for IVR (enable if you need call logs):
; noload => cdr_custom.so          ; Uncomment to disable CDR
; noload => cdr_manager.so
; noload => cel_custom.so          ; Uncomment to disable CEL
; noload => cel_manager.so

; Disable provisioning:
noload => res_phoneprov.so
noload => res_pjsip_phoneprov_provider.so

; Disable speech recognition:
noload => res_speech.so

; Disable other rarely used resources:
noload => res_adsi.so
; AGI (Asterisk Gateway Interface):
;   Disabled by default for basic IVR that uses only built-in apps.
;   Re-enable if you need:
;   - External scripts for dynamic IVR logic
;   - Database lookups during calls
;   - Third-party integrations
;   To enable: comment out the noload line below
noload => res_agi.so
noload => res_pktccops.so
noload => res_monitor.so
noload => res_smdi.so
noload => res_mwi_external.so
noload => res_mwi_external_ami.so

;
; ============================================================================
; Bridge Modules - Keep essentials for call bridging
; ============================================================================
;
; Keep (autoload):
; - bridge_simple.so
; - bridge_softmix.so (for basic mixing)
; - bridge_native_rtp.so (for RTP native bridging)

;
; ============================================================================
; Functions - Keep basic dialplan functions, disable database/ODBC/etc.
; ============================================================================
;
; Keep most func_* modules for dialplan flexibility, but disable:
noload => func_odbc.so
noload => func_curl.so             ; CURL (unless needed for external APIs)

;
; ============================================================================
; PBX Modules - Keep pbx_config for extensions.conf
; ============================================================================
;
; Keep (autoload):
; - pbx_config.so (for extensions.conf)
; - pbx_spool.so (if using call files)
;
; Disable:
noload => pbx_dundi.so             ; DUNDi
noload => pbx_loopback.so          ; Loopback switch
noload => pbx_realtime.so          ; Realtime dialplan

;
; ============================================================================
; Test/Demo Modules - Disable all
; ============================================================================
;
noload => app_test.so
noload => res_ais.so
noload => res_statsd.so
noload => res_prometheus.so

;
; ============================================================================
; NOTES ON OPTIONAL MODULES
; ============================================================================
;
; 1. SRTP/Encryption (TLS/SRTP):
;    - If your FritzBox trunk requires SRTP or TLS, remove noload from:
;      - res_srtp.so
;      - res_crypto.so
;      - res_pjsip_transport_websocket.so (if WebRTC)
;    - Otherwise, you can add these to noload for a leaner build.
;
; 2. AMI (Asterisk Manager Interface):
;    - If you need AMI for monitoring or integration, do NOT noload manager.so
;    - Default: AMI is kept loaded (commented out noload above)
;
; 3. CDR/CEL (Call Detail Records / Channel Event Logging):
;    - If you need call logging, do NOT noload cdr_* and cel_* modules
;    - For pure IVR without logging, you can noload them
;    - Default: CDR/CEL are kept (commented out noload above)
;
; 4. AGI (Asterisk Gateway Interface):
;    - If you use AGI scripts for dynamic IVR, do NOT noload res_agi.so
;    - Default: AGI is noloaded (uncomment to enable if needed)
;

; End of modules.conf
