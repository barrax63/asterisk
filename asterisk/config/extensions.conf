;
; extensions.conf - Dialplan for IVR-only Asterisk
;
; This is a minimal dialplan configuration for IVR operation.
; Customize this file according to your IVR needs.
;

[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]
; Define global variables here if needed

[incoming_calls]
exten => asterisk,1,NoOp(Incoming call to asterisk)
exten => asterisk,n,Answer()
exten => asterisk,n,Wait(1)
exten => asterisk,n,Set(CHANNEL(language)=de)
exten => asterisk,n,Playback(opening)
exten => asterisk,n,Goto(language_selection,s,1)

[language_selection]
exten => s,1(start-language),Background(select-language)
exten => s,n,WaitExten(5)

exten => 1,1,Set(CHANNEL(language)=de)
exten => 1,n,Goto(main_menu,s,1)

exten => 2,1,Set(CHANNEL(language)=en)
exten => 2,n,Goto(main_menu,s,1)

exten => i,1,Playback(invalid)
exten => i,n,Goto(s,start-language)
exten => t,1,Goto(s,start-language)

[main_menu]
exten => s,1,Playback(welcome)
exten => s,n,Playback(record-warning)
exten => s,n,Wait(1)
exten => s,n,MixMonitor(/opt/asterisk/recordings/${UNIQUEID}.wav)
exten => s,n(start-welcome),Background(menu-select)
exten => s,n,WaitExten(5)

exten => 1,1,Playback(ask-for-name)
exten => 1,n,Wait(4)
exten => 1,n,Playback(sorry)
exten => 1,n,Playback(ask-for-name-again1)
exten => 1,n,Wait(4)
exten => 1,n,Playback(sorry)
exten => 1,n,Playback(ask-for-name-again2)
exten => 1,n,Wait(4)
exten => 1,n,Playback(redirect)
exten => 1,n,Playback(redirect-music)
exten => 1,n,Playback(busy)
exten => 1,n,Hangup()

exten => 2,1(loop),Playback(music)
exten => 2,n,Goto(2,loop)

exten => i,1,Playback(invalid)
exten => i,n,Goto(s,start-welcome)
exten => t,1,Goto(s,start-welcome)
