;
; extensions.conf - Dialplan for IVR-only Asterisk
;
; This is a minimal dialplan configuration for IVR operation.
; Customize this file according to your IVR needs.
;

[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]
; Define global variables here if needed

[incoming_calls]
; This context handles incoming calls from FritzBox
; Customize the logic below for your IVR application

exten => _X.,1,NoOp(Incoming call from ${CALLERID(all)})
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(hello-world)
 same => n,Hangup()

