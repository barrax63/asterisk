[fritzbox]
type = registration
transport = transport-udp
outbound_auth = fritzbox_auth
server_uri = sip:fritz.box
client_uri = sip:asterisk@fritz.box
contact_user = asterisk

[fritzbox_auth]
type = auth
auth_type = userpass
username = asterisk
password = YOUR_PASSWORD

[fritzbox_endpoint]
type = endpoint
transport = transport-udp
context = incoming_calls
disallow = all
allow = g722
allow = alaw
allow = ulaw
auth = fritzbox_auth
aors = fritzbox_aor
identify_by = username

[fritzbox_aor]
type = aor
contact = sip:YOUR_IP:5060

[fritzbox_identify]
type = identify
endpoint = fritzbox_endpoint
match = FRITZBOX_IP

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0