;
; extensions.conf - Dialplan for IVR-only Asterisk
;
; This is a minimal dialplan configuration for IVR operation.
; Customize this file according to your IVR needs.
;

[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]
; Define global variables here if needed

[incoming_calls]
; Answer, give a short beep, then hang up
exten => asterisk,1,NoOp(Call in)
 same => n,Answer()
 same => n,Wait(0.2)
 same => n,Playtones(!440/200)   ; 200 ms 440 Hz beep, the leading "!" plays once
 same => n,Wait(1)               ; let the beep play out
 same => n,StopPlaytones()
 same => n,Hangup()
 