[fritzbox]
type = registration
transport = transport-udp
outbound_auth = fritzbox_auth
server_uri = sip:FRITZBOX_IP
client_uri = sip:ASTERISK_USER@FRITZBOX_IP
contact_user = ASTERISK_USER

[fritzbox_auth]
type = auth
auth_type = userpass
username = ASTERISK_USER
password = ASTERISK_PASSWORD

[fritzbox_endpoint]
type = endpoint
transport = transport-udp
context = incoming_calls
disallow = all
allow = g722
allow = alaw
allow = ulaw
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
auth = fritzbox_auth
aors = fritzbox_aor
identify_by = username

[fritzbox_aor]
type = aor
contact = sip:ASTERISK_IP:5060

[fritzbox_identify]
type = identify
endpoint = fritzbox_endpoint
match = FRITZBOX_IP

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060
