;
; Asterisk Manager Interface (AMI) Configuration
;

[general]
; Disable AMI by default for security
enabled = no

; Bind to localhost only (if enabled)
bindaddr = 127.0.0.1
port = 5038

; To enable AMI, set enabled=yes and create a manager user:
; [admin]
; secret = your_secret_password
; deny = 0.0.0.0/0.0.0.0
; permit = 127.0.0.1/255.255.255.255
; read = all
; write = all
