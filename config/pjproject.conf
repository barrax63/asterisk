;
; PJPROJECT Configuration
;
; Low-level PJSIP stack settings

[global]
; Logging level (0-6, 0=disabled, 6=trace)
log_level=1

; Enable/disable contact rewrite
disable_tcp_switch=yes

[system]
; Timer implementation (use timerfd on Linux)
timer=timerfd

; Threading type
threadpool_initial_size=0
threadpool_auto_increment=5
threadpool_idle_timeout=60
threadpool_max_size=50
