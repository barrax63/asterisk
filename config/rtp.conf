;
; RTP Configuration
;

[general]
; RTP port range (must match docker-compose EXPOSE)
rtpstart=10000
rtpend=20000

; Enable RTCP (RTP Control Protocol)
rtcpenable=yes

; Enable strict RTP (security - prevents RTP injection)
strictrtp=yes

; Timeout for strict RTP learning
rtptimeout=60

; Enable ICE support (for NAT traversal)
icesupport=no
