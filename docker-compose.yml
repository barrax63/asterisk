volumes:
  asterisk_config:
  asterisk_data:
  asterisk_recordings:
  asterisk_logs:

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "5"

x-security-baseline: &security-baseline
  security_opt:
    - apparmor=docker-default
  cap_drop:
    - ALL

services:
  asterisk:
    <<: *security-baseline
    build:
      context: .
      dockerfile: Dockerfile
    image: barrax63/asterisk:20-latest
    init: true
    user: "0:0"
    network_mode: host
    restart: unless-stopped
    environment:
      - TZ=Europe/Berlin
      - ASTERISK_USER=${ASTERISK_USER}
      - ASTERISK_PASSWORD=${ASTERISK_PASSWORD}
      - ASTERISK_IP=${ASTERISK_IP}
      - FRITZBOX_IP=${FRITZBOX_IP}
      - RECORDINGS_HTTP_SERVE=${RECORDINGS_HTTP_SERVE}
      - RECORDINGS_HTTP_PORT=${RECORDINGS_HTTP_PORT}
    volumes:
      # Asterisk configuration
      - asterisk_config:/etc/asterisk
      # Voicemail, SQLite DBs, runtime data
      - asterisk_data:/var/lib/asterisk
      # MixMonitor Recordings
      - asterisk_recordings:/opt/asterisk/recordings
      # Log files
      - asterisk_logs:/var/log/asterisk
    cap_add:
      - CHOWN
      - FOWNER
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
      - SYS_NICE
      - DAC_OVERRIDE
    stdin_open: true
    tty: true
    healthcheck:
      test: ["CMD", "asterisk", "-rx", "core show version"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M
    logging: *default-logging
