x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "5"

x-security-baseline: &security-baseline
  security_opt:
    - no-new-privileges:true
    - apparmor=docker-default
  cap_drop:
    - ALL

services:
  asterisk:
    <<: *security-baseline
    build:
      context: .
      dockerfile: Dockerfile
    image: barrax63/asterisk:20-latest
    init: true
    restart: unless-stopped
    environment:
      - TZ=Europe/Berlin
      - ASTERISK_USER=${ASTERISK_USER}
      - ASTERISK_PASSWORD=${ASTERISK_PASSWORD}
      - ASTERISK_IP=${ASTERISK_IP}
      - FRITZBOX_IP=${FRITZBOX_IP}
    ports:
      - "5060:5060/tcp"
      - "5060:5060/udp"
      - "10000-20000:10000-20000/udp"
    volumes:
      # Asterisk configuration
      - ./asterisk/config:/etc/asterisk
      # Voicemail, SQLite DBs, runtime data
      - ./asterisk/data:/var/lib/asterisk
      # Log files
      - ./asterisk/logs:/var/log/asterisk
    cap_add:
      - CHOWN
      - FOWNER
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
      - SYS_NICE
    stdin_open: true
    tty: true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M
    logging: *default-logging
